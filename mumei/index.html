<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f3b3d">
<meta name="apple-mobile-web-app-title" content="沐渼空間">
<title>沐渼空間｜預約</title>
<style>
:root{--ink:#1f3b3d;--lake:#549096;--coral:#fc9c8a;--paper:#f6f2ec;--line:#e2dcd2;--mute:#8a8578}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#f6f2ec;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;opacity:.85}
.brand button{background:none;border:0;color:#f6f2ec;font-size:12px;padding:4px}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.mbar b{font-size:20px;font-weight:600;letter-spacing:.04em}
.mbar .nav{display:flex;align-items:center;gap:4px}
.mbar .nav button{background:none;border:0;color:#f6f2ec;font-size:22px;width:40px;height:38px}
.mbar .tdy{font-size:12px!important;border:1px solid rgba(246,242,236,.45)!important;border-radius:20px;width:auto!important;height:28px!important;padding:0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.45}
.chip.on{opacity:1}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cal{margin:8px 8px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--mute);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.wk span:first-child,.wk span:last-child{color:#c0705f}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:78px;border-right:1px solid #f0ebe3;border-bottom:1px solid #f0ebe3;padding:3px 2px;position:relative;cursor:pointer;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day.out{background:#faf8f4}.day.out .n{opacity:.35}
.day .n{font-size:12px;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;margin:0 auto 2px}
.day.today .n{background:var(--coral);color:#fff;font-weight:600}
.day.sel{background:rgba(84,144,150,.10)}
.pill{font-size:10px;line-height:15px;border-radius:4px;padding:0 3px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.more{font-size:10px;color:var(--mute);text-align:center}
.agenda{margin:12px 8px 120px}
.agenda h4{margin:6px 6px 8px;font-size:15px}
.item{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer}
.item .bar{width:5px;border-radius:3px;flex:none}
.item .tm{font-size:12px;color:var(--mute);width:84px;flex:none}
.item b{display:block;font-size:15px}
.item small{color:var(--mute);font-size:12px}
.item .tag{display:inline-block;font-size:11px;border-radius:10px;padding:0 7px;margin-right:4px}
.empty{padding:24px 10px;text-align:center;color:var(--mute);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(252,156,138,.55);z-index:30}
.sheet{position:fixed;inset:0;background:rgba(20,30,30,.45);display:none;z-index:50;align-items:flex-end}
.sheet.on{display:flex}
.panel{background:#fff;width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.panel h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--mute);font-size:13px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7}
textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:#fbfaf7;border-radius:20px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.opts button i{width:10px;height:10px;border-radius:50%}
.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:14px;margin-top:16px;font-size:16px}
.btn:disabled{opacity:.3}
.btn.ghost{background:none;color:var(--mute);margin-top:6px}
.btn.danger{background:#fff;color:#c0392b;border:1px solid #e6c4bd}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:1em}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px}
.kv span{color:var(--mute)}
.note{background:#f6f2ec;border-radius:10px;padding:10px 12px;white-space:pre-wrap;margin-top:12px}
.login{max-width:360px;margin:12vh auto;padding:0 24px;text-align:center}
.login h1{font-size:22px;letter-spacing:.1em;margin:0 0 4px}
.login p{color:var(--mute);margin:0 0 20px}
.login label{text-align:left}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:60}
.toast.on{opacity:1}
.loading .cal{opacity:.5}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbyvrueVSHIvLrRh_g-guanQgFqs_i6ih_El0nZsVu4iSXyQfT628P3nWqzcI18Vv0MZ/exec';
var CATS = ['SPA 療程', '課程', '租借', '活動', '其他'];
var S = {token: get('mm_tok'), me: null, roster: null, month: today().slice(0, 7), sel: today(), events: [], off: {}, now: Date.now()};
function $(id) { return document.getElementById(id); }
function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function put(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function today() { var d = new Date(Date.now() + 8 * 36e5); return d.toISOString().slice(0, 10); }
function addDay(s, n) { var d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(s) { return new Date(s + 'T12:00:00Z').getUTCDay(); }
function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function mins(s) { var a = String(s).split(':'); return +a[0] * 60 + +a[1]; }
function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(function () { e.classList.remove('on'); }, 2400); }
function api(fn, args) {
  var url = EXEC + '?api=pub&fn=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args || []));
  return fetch(url, {redirect: 'follow'}).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) throw new Error(String(j.error).replace(/^Error:\s*/, ''));
    return j.result;
  });
}
function room(id) { return (S.roster.rooms.filter(function (r) { return r.id === id; })[0]) || {id: id || 'x', name: '其他', hex: '#9E9E9E'}; }
function tint(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function nice(s) { return (+s.slice(5, 7)) + ' 月 ' + (+s.slice(8, 10)) + ' 日（' + '日一二三四五六'[dow(s)] + '）'; }

/* ---------- 登入 ---------- */
function loginView() {
  $('app').innerHTML = '<div class="login"><h1>沐渼空間</h1><p>空間行事曆</p>' +
    '<label>你是誰</label><select id="lgName"><option value="">選擇名字</option>' + S.roster.people.map(function (p) { return '<option>' + esc(p.name) + '</option>'; }).join('') + '</select>' +
    '<label>生日密碼（六碼）</label><input id="lgPw" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">' +
    '<div class="err" id="lgErr"></div><button class="btn" id="lgGo">進入</button></div>';
  $('lgGo').onclick = function () {
    var b = this; b.disabled = true; $('lgErr').textContent = '';
    api('mmLogin', [$('lgName').value, $('lgPw').value]).then(function (r) {
      if (!r.ok) { $('lgErr').textContent = r.error; b.disabled = false; return; }
      S.token = r.token; put('mm_tok', r.token); load();
    }).catch(function (e) { $('lgErr').textContent = e.message; b.disabled = false; });
  };
}

/* ---------- 月曆 ---------- */
function gridStart() { var f = S.month + '-01'; return addDay(f, -dow(f)); }
function load() {
  document.body.classList.add('loading');
  var a = gridStart(), b = addDay(a, 41);
  api('mmRange', [S.token, a, b]).then(function (r) {
    document.body.classList.remove('loading');
    S.me = r.me; S.events = r.events; S.now = r.now; draw();
  }).catch(function (e) {
    document.body.classList.remove('loading');
    if (/登入/.test(e.message)) { put('mm_tok', null); S.token = null; return loginView(); }
    toast(e.message); if (!S.me) $('app').innerHTML = '<div class="empty">讀取失敗：' + esc(e.message) + '<br><br><button class="btn" onclick="load()">再試一次</button></div>';
  });
}
function shown() { return S.events.filter(function (e) { return !S.off[e.room || 'x']; }); }
function onDay(d) { return shown().filter(function (e) { return e.date === d; }).sort(function (a, b) { return (a.allDay ? '' : a.start) < (b.allDay ? '' : b.start) ? -1 : 1; }); }
function draw() {
  var y = +S.month.slice(0, 4), m = +S.month.slice(5, 7), t = today();
  var h = '<div class="top"><div class="brand"><span>沐渼空間 ・ ' + esc(S.me.name) + (S.me.admin ? '（管理者）' : '') + '</span><button id="out">登出</button></div>' +
    '<div class="mbar"><b>' + y + ' 年 ' + m + ' 月</b><div class="nav"><button id="prev">‹</button><button class="tdy" id="tdy">今天</button><button id="next">›</button></div></div></div>';
  h += '<div class="chips">' + S.roster.rooms.map(function (r) { return '<button class="chip' + (S.off[r.id] ? '' : ' on') + '" data-rf="' + r.id + '"><i style="background:' + r.hex + '"></i>' + esc(r.name) + '</button>'; }).join('') + '</div>';
  h += '<div class="cal" id="cal"><div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days">';
  var d = gridStart();
  for (var i = 0; i < 42; i++) {
    var ev = onDay(d), cls = 'day' + (d.slice(0, 7) !== S.month ? ' out' : '') + (d === t ? ' today' : '') + (d === S.sel ? ' sel' : '');
    h += '<div class="' + cls + '" data-d="' + d + '"><div class="n">' + (+d.slice(8, 10)) + '</div>' +
      ev.slice(0, 3).map(function (e) { var r = room(e.room); return '<div class="pill" style="background:' + tint(r.hex, .22) + ';border-color:' + r.hex + '">' + esc(e.item) + '</div>'; }).join('') +
      (ev.length > 3 ? '<div class="more">+' + (ev.length - 3) + '</div>' : '') + '</div>';
    d = addDay(d, 1);
  }
  h += '</div></div>';
  var list = onDay(S.sel);
  h += '<div class="agenda"><h4>' + nice(S.sel) + (S.sel === t ? '・今天' : '') + '</h4>' + (list.length ? list.map(function (e) {
    var r = room(e.room);
    return '<div class="item" data-ev="' + esc(e.id) + '"><div class="bar" style="background:' + r.hex + '"></div><div class="tm">' + (e.allDay ? '整天' : esc(e.start) + '<br>' + esc(e.end)) + '</div><div style="min-width:0">' +
      '<b>' + esc(e.item) + (e.target ? '｜' + esc(e.target) : '') + '</b><small><span class="tag" style="background:' + tint(r.hex, .2) + '">' + esc(r.name) + '</span>' + (e.cat ? '<span class="tag" style="background:#f1ece4">' + esc(e.cat) + '</span>' : '') + (e.teacher ? esc(e.teacher) : '') + (e.note ? '・📝' : '') + '</small></div></div>';
  }).join('') : '<div class="empty">這天還沒有安排，按右下角 ＋ 新增</div>') + '</div>';
  h += '<button class="fab" id="fab" aria-label="新增">＋</button>';
  $('app').innerHTML = h; bind();
}
function bind() {
  $('out').onclick = function () { put('mm_tok', null); S.token = null; S.me = null; loginView(); };
  $('prev').onclick = function () { mv(-1); };
  $('next').onclick = function () { mv(1); };
  $('tdy').onclick = function () { S.sel = today(); if (S.month !== S.sel.slice(0, 7)) { S.month = S.sel.slice(0, 7); load(); } else draw(); };
  $('fab').onclick = function () { addSheet(S.sel); };
  [].forEach.call(document.querySelectorAll('[data-rf]'), function (b) { b.onclick = function () { var k = b.dataset.rf; S.off[k] = !S.off[k]; draw(); }; });
  [].forEach.call(document.querySelectorAll('.day'), function (c) { c.onclick = function () { S.sel = c.dataset.d; if (S.sel.slice(0, 7) !== S.month) { S.month = S.sel.slice(0, 7); load(); } else draw(); }; });
  [].forEach.call(document.querySelectorAll('.item'), function (el) { el.onclick = function () { detail(S.events.filter(function (x) { return x.id === el.dataset.ev; })[0]); }; });
}
function mv(n) { var y = +S.month.slice(0, 4), m = +S.month.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = (m % 12 + 12) % 12; S.month = y + '-' + pad(m + 1); S.sel = S.month === today().slice(0, 7) ? today() : S.month + '-01'; load(); }
(function swipe() {
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) { if ($('sheet').classList.contains('on')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  document.addEventListener('touchend', function (e) {
    if (x0 == null || !S.me) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && e.target.closest && e.target.closest('#cal')) mv(dx < 0 ? 1 : -1);
  }, {passive: true});
})();

/* ---------- 新增 ---------- */
function openSheet(html) { $('panel').innerHTML = html; $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }
$('sheet').onclick = function (e) { if (e.target === this) closeSheet(); };
function addSheet(date) {
  var times = ''; for (var t = 600; t < 1320; t += 30) times += '<option value="' + t + '"' + (t === 600 ? ' selected' : '') + '>' + hm(t) + '</option>';
  var h = '<h3>新增預約</h3><div class="sub">預約人：' + esc(S.me.name) + '</div>' +
    '<label>項目 *</label><input id="bkI" maxlength="40" placeholder="例如：岩盤浴、臉部護理、讀書會">' +
    '<label>地點 *</label><div class="opts" id="bkR">' + S.roster.rooms.map(function (r) { return '<button data-v="' + r.id + '"><i style="background:' + r.hex + '"></i>' + esc(r.name) + '</button>'; }).join('') + '</div>' +
    '<label>分類</label><div class="opts" id="bkC">' + CATS.map(function (c) { return '<button data-v="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
    '<div class="row2"><div><label>日期 *</label><input id="bkD" type="date" value="' + date + '"></div><div><label>開始 *</label><select id="bkS">' + times + '</select></div></div>' +
    '<label>多久 *</label><div class="opts" id="bkL">' + [30, 60, 90, 120, 150, 180, 240].map(function (d) { return '<button data-v="' + d + '">' + (d % 60 ? d + ' 分' : d / 60 + ' 小時') + '</button>'; }).join('') + '</div>' +
    '<div class="sub" id="bkEnd" style="margin:6px 0 0"></div>' +
    '<label>對象 *</label><input id="bkO" maxlength="40" placeholder="客人或對象名字">';
  if (S.me.admin) h += '<label>負責老師</label><select id="bkT"><option value="">' + esc(S.me.name) + '（自己）</option>' +
    S.roster.people.filter(function (p) { return p.name !== S.me.name; }).map(function (p) { return '<option>' + esc(p.name) + '</option>'; }).join('') +
    '<option value="__ext">外部老師（手寫）</option></select><input id="bkTx" placeholder="外部老師名字" style="display:none;margin-top:6px">';
  h += '<label>指定幫忙的人</label><select id="bkH"><option value="">不用</option>' + S.roster.people.map(function (p) { return '<option>' + esc(p.name) + '</option>'; }).join('') + '</select>' +
    '<label>備註</label><textarea id="bkN" maxlength="500" placeholder="需要提醒的事（選填）"></textarea>' +
    '<div class="err" id="bkE"></div><button class="btn" id="bkGo" disabled>送出</button><button class="btn ghost" onclick="closeSheet()">取消</button>';
  openSheet(h);
  var v = {R: '', C: '', L: 0};
  ['R', 'C', 'L'].forEach(function (k) {
    [].forEach.call(document.querySelectorAll('#bk' + k + ' button'), function (b) {
      b.onclick = function () { [].forEach.call(document.querySelectorAll('#bk' + k + ' button'), function (x) { x.classList.remove('on'); }); b.classList.add('on'); v[k] = k === 'L' ? +b.dataset.v : b.dataset.v; check(); };
    });
  });
  function check() {
    var ext = $('bkT') && $('bkT').value === '__ext', s = +$('bkS').value;
    if ($('bkTx')) $('bkTx').style.display = ext ? 'block' : 'none';
    $('bkEnd').textContent = v.L ? hm(s) + '–' + hm(s + v.L) + (s + v.L > 1320 ? '（超過 22:00，請縮短）' : '') : '';
    $('bkGo').disabled = !(v.L && v.R && s + v.L <= 1320 && $('bkD').value && $('bkI').value.trim() && $('bkO').value.trim() && (!ext || $('bkTx').value.trim()));
  }
  ['bkI', 'bkO', 'bkT', 'bkTx', 'bkS', 'bkD'].forEach(function (id) { if ($(id)) $(id).oninput = $(id).onchange = check; });
  $('bkGo').onclick = function () {
    var b = this; b.disabled = true; $('bkE').textContent = '';
    var tv = $('bkT') ? ($('bkT').value === '__ext' ? '外部：' + $('bkTx').value.trim() : ($('bkT').value || S.me.name)) : '';
    var d = $('bkD').value;
    api('mmBookIt', [S.token, {date: d, room: v.R, cat: v.C, start: hm(+$('bkS').value), dur: v.L, item: $('bkI').value, target: $('bkO').value, teacher: tv, helper: $('bkH').value, note: $('bkN').value}])
      .then(function () { closeSheet(); toast('已加進行事曆'); S.sel = d; S.month = d.slice(0, 7); load(); })
      .catch(function (e) { $('bkE').textContent = e.message; b.disabled = false; });
  };
}
function detail(e) {
  if (!e) return; var r = room(e.room);
  var can = S.me.admin || e.booker === S.me.name;
  var h = '<h3>' + esc(e.item) + '</h3><div class="sub">' + nice(e.date) + '　' + (e.allDay ? '整天' : e.start + '–' + e.end) + '</div><div class="kv">' +
    '<span>地點</span><div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + r.hex + ';margin-right:6px"></span>' + esc(r.name) + '</div>' +
    (e.cat ? '<span>分類</span><div>' + esc(e.cat) + '</div>' : '') +
    '<span>對象</span><div>' + esc(e.target || '—') + '</div><span>負責老師</span><div>' + esc(e.teacher || '—') + '</div>' +
    '<span>預約人</span><div>' + esc(e.booker || '—') + '</div><span>幫忙</span><div>' + esc(e.helper || '—') + '</div></div>' +
    (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '') +
    (can && e.mm ? '<button class="btn danger" id="dlGo">取消這筆預約</button>' : '') + '<button class="btn ghost" onclick="closeSheet()">關閉</button>';
  openSheet(h);
  if ($('dlGo')) $('dlGo').onclick = function () {
    var b = this;
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '再按一次確認取消'; return; }
    b.disabled = true;
    api('mmCancel', [S.token, e.id]).then(function () { closeSheet(); toast('已取消'); load(); }).catch(function (x) { toast(x.message); b.disabled = false; });
  };
}

/* ---------- 啟動 ---------- */
api('mmRoster', []).then(function (r) { S.roster = r; S.token ? load() : loginView(); })
