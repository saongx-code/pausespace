function drawCart() {
  var l = cartLines(), n = 0, t = 0; l.forEach(function (x) { n += x.qty; t += x.qty * x.price; });
  $('cartSum').textContent = n ? n + ' 份・' + money(t) : '純入場 ' + money(200);
  $('cartList').innerHTML = l.length ? '已點：' + l.map(function (x) { return esc(x.name) + '×' + x.qty; }).join('、') : '';
}
function sendBar() {
  var e = $('bErr'), b = $('bSend');
  var items = cartLines();
  if (!items.length) items = [{name: '純入場', qty: 1, price: 200}];
  var p = {name: $('bName').value.trim(), seat: $('bSeat').value, pay: $('bPay').value, note: $('bNote').value.trim(), items: items};
  if (!p.name) { e.hidden = false; e.textContent = '請填寫點單姓名。'; return; }
  e.hidden = true; b.disabled = true; b.textContent = '送出中…';
  api('barOrder', [p]).then(function (r) {
    b.disabled = false; b.textContent = '確認訂單 →';
    if (r && r.ok === false) { e.hidden = false; e.textContent = r.error || '送出失敗'; return; }
    CART = {};
    page('bar', 'MOON BAR 沐吧', '<div class="eyebrow">Order received</div><h1>點單收到了</h1><div class="panel"><p>吧台已經收到你的單，稍等一下就為你送上。</p><p class="note">' + esc(p.seat) + '・' + esc(p.pay) + '</p></div><a class="btn ghost" href="#/bar">再點一杯</a>');
  }).catch(function () { b.disabled = false; b.textContent = '確認訂單 →'; e.hidden = false; e.textContent = '送出失敗，請再按一次，或直接告訴吧台。'; });
}

  if (ME) return drawMe();

    '<div class="panel"><h3>第一次來，註冊會員</h3><label for="mjName">姓名</label><input id="mjName" autocomplete="name"><label for="mjPhone">手機</label><input id="mjPhone" inputmode="tel" autocomplete="tel">' +
    '<label for="mjBirth">生日（8 碼，之後用來登入）</label><input id="mjBirth" inputmode="numeric" maxlength="8"><p class="err" id="mjErr" hidden></p><button class="btn coral" id="mjSend" type="button" style="margin-top:12px">註冊並登入</button></div>' +

}
function drawMe() {
  var m = ME, u = function (x, l) { return '<div class="stat"><span>' + l + '</span><b>' + (x ? (x.active ? '使用中' : '已到期') + '<small>' + esc(x.date) + '</small>' : '<small>未開通</small>') + '</b></div>'; };
  page('member', 'ISLAND MEMBER', '<div class="eyebrow">Welcome back</div><h1>' + esc(m.name) + '</h1>' +
    '<div class="panel"><div class="stat" style="border-top:0"><span>儲值餘額</span><b>' + money(m.balance) + '</b></div>' + u(m.discount, '八折效期') + u(m.ask, '隨時問事') + (m.note ? '<p class="note">服務留意：' + esc(m.note) + '</p>' : '') + '</div>' +
    '<div class="panel"><h3>儲值與消費明細</h3>' + (m.records.length ? m.records.map(function (x) {
      return '<div class="rec"><div><small>' + esc(x.date) + '</small><b>' + esc(x.item) + '</b>' + (x.detail ? '<small>' + esc(x.detail) + '</small>' : '') + '</div><span class="amt' + (x.amount > 0 ? ' plus' : '') + '">' + (x.amount > 0 ? '+' : '') + money(x.amount) + '</span></div>';
    }).join('') : '<p class="note">還沒有紀錄。</p>') + '</div><button class="btn ghost" id="mOut" type="button">登出</button>');

function member(fn, data, err, btn) {
  err.hidden = true; btn.disabled = true;
  api(fn, [data]).then(function (m) { btn.disabled = false; if (!m.ok) { err.hidden = false; err.textContent = m.error; return; } ME = m; drawMe(); })
    .catch(function () { btn.disabled = false; err.hidden = false; err.textContent = '連線失敗，請再試一次。'; });
}

/* ---------- 路由 ---------- */
function go(h) { location.hash = h; }
function route() {
  var h = (location.hash || '#/').slice(2).split('/');
  var r = h[0] || 'services', a = h[1];
  if (r === 'bar') return vBar();
  if (r === 'events') return a ? vEvent(a) : vEvents();
  if (!B) { needBoot(); return; }
  if (r === 'services') return a ? vCategory(a) : vServices();
  if (r === 'book') return vBook(a);
  if (r === 'time') return vTime();
  if (r === 'report') return vReport();
  if (r === 'tools') return vTools();
  if (r === 'gifts' || r === 'benefits') return a ? vGift(a) : vGifts();
  if (r === 'member') return vMember();
  vServices();
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.d && t.classList.contains('dt')) { ST.date = t.dataset.d; ST.start = null; drawDates(); loadTimes(); if ($('formBox')) $('formBox').hidden = true; if ($('fitBox')) $('fitBox').innerHTML = ''; return; }
  if (t.dataset.t) {
    ST.start = t.dataset.t; [].forEach.call(document.querySelectorAll('.tm'), function (x) { x.classList.toggle('on', x === t); });
    if (ST.svc) drawForm(); else drawFit(+t.dataset.fit); return;
  }
  if (t.dataset.pick) { ST.svc = svc(t.dataset.pick); drawForm(); return; }
  if (t.id === 'fSend') return sendBooking();
  if (t.id === 'copyBank') { var txt = $('bank').textContent; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { t.textContent = '已複製'; }); return; }
  if (t.id === 'dSend') return report(ST.last.code, ST.last.phone, $('dLast5').value.trim(), $('dErr'), t, function () { $('dOk').hidden = false; t.hidden = true; });
  if (t.id === 'rSend') return report($('rCode').value.trim().toUpperCase(), $('rPhone').value.trim(), $('rLast5').value.trim(), $('rErr'), t, function () { $('rOk').hidden = false; });
  if (t.dataset.bc) { ST.bName = $('bName').value; ST.bSeat = $('bSeat').value; BARCAT = t.dataset.bc; vBar(); $('barTabs').scrollIntoView({block: 'start'}); return; }
  if (t.dataset.oi) { ST.opt[t.dataset.oi] = t.dataset.ov; ST.bName = $('bName').value; ST.bSeat = $('bSeat').value; var y = window.scrollY; vBar(); window.scrollTo(0, y); return; }
  if (t.dataset.q) { var it = BAR.items.filter(function (x) { return x.id === t.dataset.q; })[0], ck = cartKey(it); var q = Math.max(0, (CART[ck] || 0) + Number(t.dataset.d)); CART[ck] = q; t.parentNode.querySelector('span').textContent = q; drawCart(); return; }
  if (t.id === 'bSend') return sendBar();
  if (t.id === 'mlSend') return member('memberLogin', {phone: $('mlPhone').value, birthday: $('mlBirth').value}, $('mlErr'), t);
  if (t.id === 'mjSend') return member('memberJoin', {name: $('mjName').value, phone: $('mjPhone').value, birthday: $('mjBirth').value}, $('mjErr'), t);
  if (t.id === 'mOut') { ME = null; return vMember(); }
});
window.addEventListener('hashchange', route);
(function () {
  var g = (location.search.match(/[?&]go=(\w+)/) || [])[1];
  if (g && !location.hash) { history.replaceState(null, '', location.pathname + '#/' + (g === 'benefits' ? 'gifts' : g)); }
  route();
  api('getBootstrap', []).then(function (d) { B = d; if (d.images) Object.keys(d.images).forEach(function (k) { IMG[k] = d.images[k]; }); route(); })
    .catch(function () { $('app').innerHTML = '<div class="loading">暫時讀不到預約資料，請稍後重新整理，或直接 <a href="https://line.me/R/ti/p/' + LINE_ID + '">LINE 島主</a>。</div>'; });
})();
