.stat{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding:10px 0}

.amt{white-space:nowrap}.amt.plus{color:var(--ok)}

ul.steps{margin:6px 0;padding-left:20px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
